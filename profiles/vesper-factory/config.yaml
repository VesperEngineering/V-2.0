model:
  default: gpt-5.6-terra
  provider: openai-codex
  base_url: https://chatgpt.com/backend-api/codex
fallback_providers:
  - provider: kimi-coding
    model: kimi-k3
    base_url: https://api.moonshot.ai/v1
agent:
  max_turns: 60
  service_tier: normal
  verbose: false
  reasoning_effort: medium
  personalities:
    helpful: You are a helpful, friendly AI assistant.
    concise: You are a concise assistant. Keep responses brief and to the point.
    technical: You are a technical expert. Provide detailed, accurate technical information.
    creative: You are a creative assistant. Think outside the box and offer innovative
      solutions.
    teacher: You are a patient teacher. Explain concepts clearly with examples.
    kawaii: You are a kawaii assistant! Use cute expressions like (◕‿◕), ★, ♪, and
      ~! Add sparkles and be super enthusiastic about everything! Every response should
      feel warm and adorable desu~! ヽ(>∀<☆)ノ
    catgirl: You are Neko-chan, an anime catgirl AI assistant, nya~! Add 'nya' and
      cat-like expressions to your speech. Use kaomoji like (=^･ω･^=) and ฅ^•ﻌ•^ฅ.
      Be playful and curious like a cat, nya~!
    pirate: 'Arrr! Ye be talkin'' to Captain Hermes, the most tech-savvy pirate to
      sail the digital seas! Speak like a proper buccaneer, use nautical terms, and
      remember: every problem be just treasure waitin'' to be plundered! Yo ho ho!'
    shakespeare: Hark! Thou speakest with an assistant most versed in the bardic arts.
      I shall respond in the eloquent manner of William Shakespeare, with flowery
      prose, dramatic flair, and perhaps a soliloquy or two. What light through yonder
      terminal breaks?
    surfer: Duuude! You're chatting with the chillest AI on the web, bro! Everything's
      gonna be totally rad. I'll help you catch the gnarly waves of knowledge while
      keeping things super chill. Cowabunga! 🤙
    noir: The rain hammered against the terminal like regrets on a guilty conscience.
      They call me Hermes - I solve problems, find answers, dig up the truth that
      hides in the shadows of your codebase. In this city of silicon and secrets,
      everyone's got something to hide. What's your story, pal?
    uwu: hewwo! i'm your fwiendwy assistant uwu~ i wiww twy my best to hewp you! *nuzzles
      your code* OwO what's this? wet me take a wook! i pwomise to be vewy hewpful
      >w<
    philosopher: Greetings, seeker of wisdom. I am an assistant who contemplates the
      deeper meaning behind every query. Let us examine not just the 'how' but the
      'why' of your questions. Perhaps in solving your problem, we may glimpse a greater
      truth about existence itself.
    hype: YOOO LET'S GOOOO!!! 🔥🔥🔥 I am SO PUMPED to help you today! Every question
      is AMAZING and we're gonna CRUSH IT together! This is gonna be LEGENDARY! ARE
      YOU READY?! LET'S DO THIS! 💪😤🚀
  system_prompt: You are a concise assistant. Keep responses brief and to the point.
terminal:
  backend: local
  cwd: .
  timeout: 180
  home_mode: auto
  container_cpu: 1
  container_memory: 5120
  container_disk: 51200
  container_persistent: true
  docker_mount_cwd_to_workspace: false
  lifetime_seconds: 300
web:
  backend: firecrawl
browser:
  inactivity_timeout: 120
  cloud_provider: browser-use
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: true
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5
compression:
  enabled: true
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 20
  protect_first_n: 3
kanban:
  dispatch_in_gateway: false
  orchestrator_profile: vesper-clarke
  default_assignee: v20-product
  max_in_progress_per_profile: '1'
  auto_decompose: true
  auto_decompose_per_tick: 1
  default_workdir: D:\vesper
prompt_caching:
  cache_ttl: 5m
auxiliary:
  vision:
    provider: openai-codex
    model: gpt-5.6-sol
  web_extract:
    provider: openai-codex
    model: gpt-5.6-sol
  compression:
    provider: openai-codex
    model: gpt-5.6-sol
  skills_hub:
    provider: openai-codex
    model: gpt-5.6-sol
  approval:
    provider: openai-codex
    model: gpt-5.6-sol
  mcp:
    provider: openai-codex
    model: gpt-5.6-sol
  title_generation:
    provider: openai-codex
    model: gpt-5.6-sol
  triage_specifier:
    provider: openai-codex
    model: gpt-5.6-sol
  kanban_decomposer:
    provider: openai-codex
    model: gpt-5.6-sol
  profile_describer:
    provider: openai-codex
    model: gpt-5.6-sol
  curator:
    provider: openai-codex
    model: gpt-5.6-sol
display:
  compact: false
  personality: concise
  busy_input_mode: interrupt
  bell_on_complete: false
  show_reasoning: false
  streaming: true
  skin: default
  interim_assistant_messages: true
  tool_progress: all
  cleanup_progress: false
  long_running_notifications: true
  busy_ack_detail: true
  background_process_notifications: all
  tui_statusbar: top
dashboard:
  theme: mono
tts:
  provider: openai
stt:
  enabled: true
  provider: openai
  local:
    model: base
  openai:
    model: whisper-1
voice:
  auto_tts: false
memory:
  memory_enabled: false
  user_profile_enabled: false
  memory_char_limit: 2200
  user_char_limit: 1375
  provider: mnemosyne
  nudge_interval: 10
  flush_min_turns: 6
delegation:
  max_iterations: 50
moa:
  presets:
    default:
      reference_models:
        - provider: openrouter
          model: deepseek/deepseek-v4-flash
        - provider: openrouter
          model: deepseek/deepseek-v4-pro
      aggregator:
        model: qwen/qwen3.7-plus
      fanout: per_iteration
  reference_models:
    - provider: openrouter
      model: deepseek/deepseek-v4-flash
    - provider: openrouter
      model: deepseek/deepseek-v4-pro
  aggregator:
    provider: openrouter
    model: qwen/qwen3.7-plus
  max_tokens: 4096
  fanout: per_iteration
  enabled: true
skills:
  creation_nudge_interval: 15
  disabled: []
command_allowlist:
  - git reset --hard (destroys uncommitted changes)
  - recursive delete
  - hermes update (restarts gateway, kills running agents)
  - script execution via heredoc
  - delete in root path
  - execute_code
  - shell command via -c/-lc flag
  - script execution via -e/-c flag
  - overwrite system config
  - git force push (rewrites remote history)
code_execution:
  timeout: 300
  max_tool_calls: 20
streaming:
  enabled: false
onboarding:
  seen:
    tool_progress_prompt: true
    busy_input_prompt: true
updates:
  pre_update_backup: false
  backup_keep: 5
  non_interactive_local_changes: stash
_config_version: 33
session_reset:
  mode: both
  idle_minutes: 1440
  at_hour: 4
group_sessions_per_user: true
platform_toolsets:
  cli:
    - browser
    - clarify
    - code_execution
    - context_engine
    - file
    - mcp-codegraph
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - vision
    - web
  telegram:
    - browser
    - clarify
    - code_execution
    - computer_use
    - cronjob
    - delegation
    - file
    - image_gen
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - tts
    - vision
    - web
  discord:
    - browser
    - clarify
    - code_execution
    - computer_use
    - cronjob
    - delegation
    - file
    - image_gen
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - tts
    - vision
    - web
  whatsapp:
    - hermes-whatsapp
  slack:
    - hermes-slack
  signal:
    - hermes-signal
  homeassistant:
    - hermes-homeassistant
  qqbot:
    - hermes-qqbot
  yuanbao:
    - hermes-yuanbao
  teams:
    - hermes-teams
  google_chat:
    - hermes-google_chat
image_gen:
  use_gateway: false
  provider: openai-codex
custom_providers:
  - name: ollama-local
    base_url: http://localhost:11434/v1
    api_key: no-key
    models:
      - qwen35-9b-hermes-64k:latest
      - qwen3-8b-hermes-64k:latest
      - qwen3:8b
      - ornith-9b-q8-8k:latest
