      - hf.co/unsloth/Phi-4-reasoning-plus-GGUF:Q6_K
      - hf.co/unsloth/Qwen3-Coder-30B-A3B-Instruct-GGUF:Q3_K_S
      - hf.co/deepreinforce-ai/Ornith-1.0-9B-GGUF:Q8_0
      - qwythos-9b-q8-8k:latest
      - hf.co/empero-ai/Qwythos-9B-Claude-Mythos-5-1M-GGUF:Q8_0
      - hf.co/unsloth/Devstral-Small-2-24B-Instruct-2512-GGUF:Q4_K_S
      - gpt-oss:20b
