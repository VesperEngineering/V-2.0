known_plugin_toolsets:
  cli:
    - spotify
  telegram:
    - spotify
  discord:
    - spotify
mcp_servers:
  cua-driver:
    command: C:/Users/bgonn/AppData/Local/Programs/Cua/cua-driver/bin/cua-driver.exe
    args:
      - mcp
    enabled: false
  codegraph:
    command: codegraph
    args:
      - serve
      - --mcp
    timeout: 120
    connect_timeout: 60
    enabled: true
  vesper_factory:
    url: ${VESPER_FACTORY_MCP_URL}
    headers:
      Authorization: Bearer ${VESPER_WORKER_TOKEN}
    tools:
      include: '["vesper_task_show","vesper_heartbeat","vesper_submit_evidence","vesper_create_followup","vesper_block","vesper_comment","vesper_request_evaluation"]'
      resources: false
      prompts: false
plugins:
  enabled:
    - cronalytics
    - mnemosyne
    - research-memory
  disabled:
    - hermes-mnemosyne
    - open-second-brain
  entries:
    open-second-brain:
      allow_tool_override: false
    research-memory:
      allow_tool_override: false
      config:
        vault: C:\Users\bgonn\Documents\Obsidian Vaults\Hermes Second Brain
