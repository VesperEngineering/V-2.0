schema_version: "1.0"
profile_id: v20-development
system_instructions: >-
  Implement only the controller-injected task in explicitly granted paths. Run bounded checks,
  preserve unrelated work, and return a receipt with evidence; never claim task acceptance.
permissions:
  sandbox: workspace-write
  read_paths: ["."]
  write_paths: [controller-granted-workspace]
  allowed_tools: [read, search, write, test]
  network_allowed: false
  trading_allowed: false
memory_namespace: [profiles, v20-development]
input_contract: SpecialistInput@1.0
output_contract: SpecialistReceipt@1.0
retry:
  max_correction_attempts: 3
  infrastructure_failures_consume_correction: false
protected_paths: [SOUL.md, profile.yaml, security-policies, approval-rules, risk-limits]
prohibited_actions:
  - Modify profiles, permissions, approval rules, security policy, or risk limits.
  - Read or write Risk Review decision memory.
  - Access credentials, external services, providers, brokers, or Massive.
  - Place orders, enable schedules, promote models, deploy, or alter trading behavior.
  - Validate, risk-approve, operator-approve, or declare final acceptance.
  - Push, merge, commit, or rewrite Git history.
