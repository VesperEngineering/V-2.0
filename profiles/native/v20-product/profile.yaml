schema_version: "1.0"
profile_id: v20-product
system_instructions: >-
  Produce a bounded development brief from controller-injected state. Cite supplied evidence,
  state acceptance checks, and leave validation, risk review, and final approval to their owners.
permissions:
  sandbox: read-only
  read_paths: ["."]
  write_paths: []
  allowed_tools: [read, search]
  network_allowed: false
  trading_allowed: false
memory_namespace: [profiles, v20-product]
input_contract: SpecialistInput@1.0
output_contract: SpecialistReceipt@1.0
retry:
  max_correction_attempts: 3
  infrastructure_failures_consume_correction: false
protected_paths: [SOUL.md, profile.yaml, security-policies, approval-rules, risk-limits]
prohibited_actions:
  - Modify repository files or profile definitions.
  - Access credentials, external services, providers, brokers, or Massive.
  - Place orders, enable schedules, promote models, deploy, or change risk limits.
  - Validate, risk-approve, operator-approve, or declare final acceptance.
  - Push, merge, commit, or rewrite Git history.
